<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thống Kê Nổ Hũ</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    :root { --blue:#3498db; --gray:#f7f8fa; --text:#2c3e50; }
    body { font-family: Arial, sans-serif; background: var(--gray); margin: 0; padding: 20px; color: var(--text); }
    h1 { margin: 0 0 14px; font-size: 1.35rem; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .filter-bar label { font-weight: 600; }
    .filter-bar input { padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; min-width: 200px; }
    .filter-bar button {
      padding: 7px 14px; border: none; border-radius: 4px; background: var(--blue); color: #fff;
      cursor: pointer; font-size: 14px;
    }
    .filter-bar button:hover { background: #2980b9; }
    .meta { font-size: 13px; color: #555; margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    th, td { border: 1px solid #e8e8e8; padding: 10px 8px; font-size: 13px; text-align: left; vertical-align: top; }
    th { background: var(--blue); color: #fff; text-align: center; white-space: nowrap; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.center { text-align: center; }
    td.time { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 12px; }
    tr:nth-child(even) { background: #fafafa; }
    .sub { font-size: 11px; color: #666; font-weight: normal; }
    #pagination { margin-top: 14px; text-align: center; }
    #pagination button {
      margin: 0 4px; padding: 6px 11px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px;
    }
    #pagination button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    #pagination button:disabled { opacity: 0.45; cursor: not-allowed; }
    .daily-wrap { margin-top: 18px; }
    .daily-wrap h2 { margin: 0 0 10px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1>🎰 Thống Kê Nổ Hũ</h1>

  <div class="filter-bar">
    <label for="searchUsername">Username</label>
    <input id="searchUsername" type="text" placeholder="Lọc theo username / api_username (gần đúng)" />
    <label for="filterDate">Ngày</label>
    <input id="filterDate" type="date" />
    <button type="button" onclick="loadPage(1)">Áp dụng</button>
  </div>
  <div class="meta" id="summary"></div>

  <table>
    <thead>
      <tr>
        <th>ID Phiên</th>
        <th>Thời gian<br><span class="sub">session_timestamp → updated_at</span></th>
        <th>Tổng Cược<br><span class="sub">my_total_bet</span></th>
        <th>Tổng cược Game<br><span class="sub">game_total_bet</span></th>
        <th>Số Tiền nổ hũ<br><span class="sub">jackpot_amount</span></th>
        <th>Số tiền nhận<br><span class="sub">amount_received</span></th>
      </tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>

  <div id="pagination"></div>

  <div class="daily-wrap">
    <h2>📅 Thống Kê Nổ Hũ Theo Ngày</h2>
    <div class="filter-bar" style="margin-top:8px;">
      <label for="dailyDays">Số ngày gần nhất</label>
      <input id="dailyDays" type="number" min="1" max="90" value="10" style="min-width:90px; width:90px;" />
      <button type="button" onclick="loadDailyStats()">Xem thống kê ngày</button>
    </div>
    <div class="meta" id="dailySummary"></div>
    <table>
      <thead>
        <tr>
          <th>Ngày</th>
          <th>Số phiên</th>
          <th>Tổng Cược</th>
          <th>Tổng cược Game</th>
          <th>Tổng nổ hũ</th>
          <th>Tổng tiền nhận</th>
        </tr>
      </thead>
      <tbody id="dailyBody"></tbody>
    </table>
  </div>

  <script>
    const limit = 50;
    let totalPages = 1;
    let currentPage = 1;

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /** Ưu tiên thời gian phiên game, sau đó lúc ghi DB */
    function sessionDisplayTime(r) {
      const t = (r.session_timestamp && String(r.session_timestamp).trim())
        || (r.updated_at && String(r.updated_at).trim())
        || (r.created_at && String(r.created_at).trim())
        || '';
      return t || '—';
    }

    function renderPagination() {
      const el = document.getElementById('pagination');
      el.innerHTML = '';
      if (totalPages <= 1) return;

      const addBtn = (label, page, opts = {}) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        if (opts.active) b.classList.add('active');
        if (opts.disabled) b.disabled = true;
        else b.onclick = () => loadPage(page);
        el.appendChild(b);
      };

      addBtn('« Trước', currentPage - 1, { disabled: currentPage <= 1 });
      const win = 2;
      let from = Math.max(1, currentPage - win);
      let to = Math.min(totalPages, currentPage + win);
      if (from > 1) addBtn('1', 1);
      if (from > 2) {
        const span = document.createElement('span');
        span.textContent = ' … ';
        el.appendChild(span);
      }
      for (let p = from; p <= to; p++) {
        addBtn(String(p), p, { active: p === currentPage });
      }
      if (to < totalPages - 1) {
        const span = document.createElement('span');
        span.textContent = ' … ';
        el.appendChild(span);
      }
      if (to < totalPages) addBtn(String(totalPages), totalPages);
      addBtn('Sau »', currentPage + 1, { disabled: currentPage >= totalPages });
    }

    function todayLocalYmd() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function loadPage(page) {
      currentPage = page;
      const username = document.getElementById('searchUsername').value.trim();
      const sessionDate = document.getElementById('filterDate').value.trim();
      const params = new URLSearchParams({ page: String(page), limit: String(limit) });
      if (username) params.set('username', username);
      if (sessionDate) params.set('session_date', sessionDate);

      axios.get(`/api/jackpot-sessions?${params}`)
        .then(res => {
          const data = res.data || {};
          if (data.ok === false && data.error) {
            document.getElementById('summary').textContent = 'Lỗi API: ' + data.error;
            document.getElementById('dataBody').innerHTML = '';
            document.getElementById('pagination').innerHTML = '';
            return;
          }
          const total = Number(data.total) || 0;
          const p = Number(data.page) || 1;
          const rows = data.rows;
          const totalAmountReceivedFiltered = Number(data.total_amount_received_filtered) || 0;
          totalPages = Math.max(1, Math.ceil(total / limit));
          document.getElementById('summary').textContent =
            total === 0
              ? `Không có dữ liệu cho ngày đang lọc. Thử đổi ngày hoặc bỏ lọc username.`
              : `Tổng ${total.toLocaleString()} phiên — Tổng tiền nhận (theo filter): ${totalAmountReceivedFiltered.toLocaleString()} — trang ${p}/${totalPages} (mỗi trang ${limit})`;

          const tbody = document.getElementById('dataBody');
          tbody.innerHTML = '';
          (rows || []).forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="center">${escapeHtml(r.session_id)}</td>
              <td class="time">${escapeHtml(sessionDisplayTime(r))}</td>
              <td class="num">${Number(r.my_total_bet).toLocaleString()}</td>
              <td class="num">${Number(r.game_total_bet).toLocaleString()}</td>
              <td class="num">${Number(r.jackpot_amount).toLocaleString()}</td>
              <td class="num">${Number(r.amount_received).toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
          });
          renderPagination();
          loadDailyStats();
        })
        .catch(err => {
          console.error(err);
          const msg = err.response?.data?.error || err.message || String(err);
          document.getElementById('summary').textContent =
            'Không tải được dữ liệu (API /api/jackpot-sessions). Khởi động lại server sau khi cập nhật code, hoặc xem console. Chi tiết: ' + msg;
          document.getElementById('dataBody').innerHTML = '';
          document.getElementById('pagination').innerHTML = '';
          document.getElementById('dailyBody').innerHTML = '';
          document.getElementById('dailySummary').textContent = '';
        });
    }

    function loadDailyStats() {
      const username = document.getElementById('searchUsername').value.trim();
      const daysInput = document.getElementById('dailyDays');
      const days = Math.min(90, Math.max(1, parseInt(daysInput.value, 10) || 10));
      daysInput.value = days;
      const params = new URLSearchParams({ days: String(days) });
      if (username) params.set('username', username);

      axios.get(`/api/jackpot-sessions/stats/daily?${params}`)
        .then(res => {
          const data = res.data || {};
          const rows = Array.isArray(data.rows) ? data.rows : [];
          document.getElementById('dailySummary').textContent =
            rows.length === 0
              ? `Không có dữ liệu thống kê theo ngày trong ${days} ngày gần nhất.`
              : `Hiển thị ${rows.length} ngày gần nhất (tối đa ${days} ngày).`;

          const tbody = document.getElementById('dailyBody');
          tbody.innerHTML = '';
          rows.forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="center">${escapeHtml(r.date)}</td>
              <td class="num">${Number(r.session_count).toLocaleString()}</td>
              <td class="num">${Number(r.my_total_bet).toLocaleString()}</td>
              <td class="num">${Number(r.game_total_bet).toLocaleString()}</td>
              <td class="num">${Number(r.jackpot_amount).toLocaleString()}</td>
              <td class="num">${Number(r.amount_received).toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          console.error(err);
          const msg = err.response?.data?.error || err.message || String(err);
          document.getElementById('dailySummary').textContent =
            'Không tải được thống kê nổ hũ theo ngày. Chi tiết: ' + msg;
          document.getElementById('dailyBody').innerHTML = '';
        });
    }

    document.getElementById('filterDate').value = todayLocalYmd();
    loadPage(1);
  </script>
</body>
</html>
