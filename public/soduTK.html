<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Device Balance</title>
  <style>
    .container { padding: 20px; }
    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0 10px 0;
      color: #333;
    }
    .form-row { margin-bottom: 10px; }
    .form-row input {
      margin-right: 10px;
      padding: 6px;
      height: 34px;
      width: 200px;
      box-sizing: border-box;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
    }
    .btn {
      padding: 6px 12px;
      background-color: #2ecc71;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }
    .btn:hover { background-color: #27ae60; }
    #deviceTable { width: 100%; border-collapse: collapse; margin-top:20px; }
    #deviceTable th, #deviceTable td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: center;
    }
    #deviceTable th { background-color: #3498db; color: #fff; }
    .editable-balance {
      border-bottom: 1px dashed #3498db;
      color: #3498db;
      cursor: pointer;
      display: inline-block;
      min-width: 60px;
      padding: 2px 4px;
    }
    .editable-balance.high-balance {
      color: #e74c3c;
      font-weight: bold;
    }
    .editable-input {
      width: 120px;
      text-align: center;
      padding: 4px;
      border: 1px solid #3498db;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Form thêm/sửa -->
    <h2 class="section-title">Thêm / Cập nhật Device</h2>
    <form id="deviceForm">
      <div class="form-row">
        <input type="text" id="device" placeholder="Tên Device" required>
        <input type="number" id="balance" placeholder="Số dư" required>
        <input type="text" id="bank" placeholder="Ngân hàng">               <!-- 🆕 -->
        <input type="text" id="username" placeholder="Tên đăng nhập">       <!-- 🆕 -->
        <input type="text" id="accountNumber" placeholder="STK ngân hàng">
        <input type="text" id="accountHolder" placeholder="Chủ tài khoản">
        <button type="submit" class="btn" id="submitBtn">Thêm Device</button>
      </div>
    </form>


    <hr>

    <!-- Danh sách device -->
    <h2 class="section-title">Danh sách Device</h2>
    <div class="form-row">
      <input type="text" id="filterBank" placeholder="Lọc theo ngân hàng">
      <input type="text" id="filterUsername" placeholder="Tìm theo tên đăng nhập">
      <input type="text" id="filterDevice" placeholder="Tìm theo device">
      <input type="number" id="filterMinBalance" placeholder="Số dư >= " min="0">
      <button type="button" class="btn" id="clearFiltersBtn">Xóa lọc</button>
    </div>
    <h3 id="totalBalanceDisplay">Tổng số dư: 0 đ</h3>
    <table id="deviceTable">
      <thead>
        <tr>
          <th>Device</th>
          <th>Số dư</th>
          <th>Ngân hàng</th>        <!-- 🆕 -->
          <th>Tên đăng nhập</th>
          <th>STK</th>
          <th>Chủ tài khoản</th>
          <th>Sửa</th>
          <th>Xóa</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
let isEditMode = false;
let editingDevice = '';
let allDevices = [];

async function loadDevices() {
  const res = await fetch("/api/device-balances");
  const data = await res.json();
  allDevices = Array.isArray(data) ? data : [];
  applyFilters();
}

function renderDevices(list) {
  const tbody = document.querySelector("#deviceTable tbody");
  tbody.innerHTML = "";
  let totalBalance = 0; // 🆕 tạo biến tổng

  list.forEach(item => {
    totalBalance += item.balance || 0; // 🆕 cộng dồn
    const deviceValue = item.device || "";
    const balanceValue = item.balance || 0;
    const bankValue = item.bank || "";
    const usernameValue = item.username || "";
    const accountNumberValue = item.accountNumber || "";
    const accountHolderValue = item.accountHolder || "";
    
    tbody.innerHTML += `
      <tr>
        <td>${deviceValue || "---"}</td>
        <td>
          <span class="editable-balance ${balanceValue >= 3000000 ? 'high-balance' : ''}" data-device="${item.device}" data-field="balance">
            ${balanceValue.toLocaleString('vi-VN')} đ
          </span>
        </td>
        <td>${bankValue || "---"}</td>
        <td>${usernameValue || "---"}</td>
        <td>${accountNumberValue || "---"}</td>
        <td>${accountHolderValue || "---"}</td>
        <td><button class="btn edit-btn" data-device="${item.device}">Sửa</button></td>
        <td><button class="btn delete-btn" data-device="${item.device}">Xóa</button></td>
      </tr>
    `;
  });

  // 🆕 hiển thị tổng số dư ra thẻ h3 đã tạo
  document.getElementById("totalBalanceDisplay").textContent =
    "Tổng số dư: " + totalBalance.toLocaleString('vi-VN') + " đ";
}

function applyFilters() {
  const bankFilter = document.getElementById("filterBank").value.trim().toLowerCase();
  const usernameFilter = document.getElementById("filterUsername").value.trim().toLowerCase();
  const deviceFilter = document.getElementById("filterDevice").value.trim().toLowerCase();
  const minBalanceRaw = document.getElementById("filterMinBalance").value.trim();
  const minBalance = minBalanceRaw === "" ? null : Number(minBalanceRaw) * 1000000;

  const filtered = allDevices.filter(item => {
    const bank = (item.bank || "").toLowerCase();
    const username = (item.username || "").toLowerCase();
    const device = (item.device || "").toLowerCase();
    const balance = Number(item.balance || 0);
    const bankOk = !bankFilter || bank.includes(bankFilter);
    const userOk = !usernameFilter || username.includes(usernameFilter);
    const deviceOk = !deviceFilter || device.includes(deviceFilter);
    const balanceOk = minBalance === null || (Number.isFinite(minBalance) && balance >= minBalance);
    return bankOk && userOk && deviceOk && balanceOk;
  });

  renderDevices(filtered);
}

function readForm() {
  return {
    device: document.getElementById("device").value,
    balance: Number(document.getElementById("balance").value),
    bank: document.getElementById("bank").value,             // 🆕 thêm
    username: document.getElementById("username").value,     // 🆕 thêm
    accountNumber: document.getElementById("accountNumber").value,
    accountHolder: document.getElementById("accountHolder").value
  };
}

function fillForm(item) {
  document.getElementById("device").value = item.device || "";
  document.getElementById("balance").value = item.balance || 0;
  document.getElementById("bank").value = item.bank || "";               // 🆕
  document.getElementById("username").value = item.username || "";       // 🆕
  document.getElementById("accountNumber").value = item.accountNumber || "";
  document.getElementById("accountHolder").value = item.accountHolder || "";
}

function resetForm() {
  document.getElementById("deviceForm").reset();
  isEditMode = false;
  editingDevice = '';
  document.getElementById("submitBtn").textContent = "Thêm Device";
}
document.getElementById("deviceForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = readForm();

  if (isEditMode && editingDevice) {
    // ✅ Update device
    await fetch(`/api/device-balances/${editingDevice}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } else {
    // ✅ Thêm mới device
    await fetch("/api/device-balances", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  }

  resetForm();
  loadDevices();
});

document.getElementById("filterBank").addEventListener("input", applyFilters);
document.getElementById("filterUsername").addEventListener("input", applyFilters);
document.getElementById("filterDevice").addEventListener("input", applyFilters);
document.getElementById("filterMinBalance").addEventListener("input", applyFilters);
document.getElementById("clearFiltersBtn").addEventListener("click", () => {
  document.getElementById("filterBank").value = "";
  document.getElementById("filterUsername").value = "";
  document.getElementById("filterDevice").value = "";
  document.getElementById("filterMinBalance").value = "";
  applyFilters();
});


document.addEventListener("click", async (e) => {
  // XÓA
  if (e.target.classList.contains("delete-btn")) {
    const device = e.target.dataset.device;
    if (confirm("Bạn có chắc muốn xóa device này?")) {
      await fetch(`/api/device-balances/${device}`, { method: "DELETE" });
      loadDevices();
    }
  }

  // SỬA
  if (e.target.classList.contains("edit-btn")) {
    const device = e.target.dataset.device;
    const res = await fetch(`/api/device-balances/${device}`);
    const item = await res.json();

    fillForm(item);
    isEditMode = true;
    editingDevice = device;
    document.getElementById("submitBtn").textContent = "Cập nhật";
  }
});

// ================= INLINE EDIT BALANCE ONLY =================
document.addEventListener('click', function(e) {
  if (!e.target.classList.contains('editable-balance')) return;

  const span = e.target;
  const device = span.dataset.device;
  const oldValue = span.innerText.trim().replace(/\s*đ$/, '').replace(/\./g, ''); // Remove " đ" and dots

  const input = document.createElement('input');
  input.type = 'number';
  input.value = (oldValue === '---') ? '' : oldValue;
  input.className = 'editable-input';
  input.style.width = '150px';

  span.replaceWith(input);
  input.focus();
  input.select();

  input.addEventListener('blur', async () => {
    let newValue = input.value.trim();
    
    // Get current device data
    const res = await fetch(`/api/device-balances/${device}`);
    const currentData = await res.json();
    
    // Update only balance field
    const updatedData = {
      device: currentData.device || "",
      balance: Number(newValue || 0),
      bank: currentData.bank || "",
      username: currentData.username || "",
      accountNumber: currentData.accountNumber || "",
      accountHolder: currentData.accountHolder || ""
    };

    try {
      const updateRes = await fetch(`/api/device-balances/${device}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updatedData)
      });

      if (!updateRes.ok) {
        throw new Error('Cập nhật thất bại');
      }

      await loadDevices();
    } catch (err) {
      console.error("Lỗi khi cập nhật số dư:", err);
      alert("Cập nhật số dư thất bại!");
      await loadDevices();
    }
  });

  input.addEventListener('keypress', async (e) => {
    if (e.key === 'Enter') {
      input.blur();
    }
  });
});

loadDevices();
</script>

</body>
</html>
