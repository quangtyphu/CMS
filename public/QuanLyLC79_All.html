<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard LC79</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --blue:#3498db; --green:#2ecc71; --red:#e74c3c; --gray:#f7f8fa; }
    body{font-family:Arial, sans-serif; background:var(--gray); margin:0; padding:20px;}
    h2{margin:0 0 12px;}
    button{padding:4px 8px; border:none; border-radius:4px; background:var(--blue); color:#fff; cursor:pointer; font-size:12px;}
    button:hover{background:#2980b9;}
    .cancel-btn{background:var(--red);} .cancel-btn:hover{background:#c0392b;}
    table{width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden;}
    th, td{border:1px solid #eee; padding:8px; text-align:center; font-size:14px;}
    th{background:var(--blue); color:#fff; position:sticky; top:0; z-index:1;}
    .muted{color:#888;}
    .editable-device{border-bottom:1px dashed var(--blue); color:var(--blue); cursor:pointer; display:inline-block; min-width:60px;}
    .editable-input{width:120px; text-align:center;}
    .status-select.playing{background:var(--green); color:#fff; font-weight:bold;}
    .status-select.done{background:var(--red); color:#fff; font-weight:bold;}
    .right{text-align:right;}
    .nowrap{white-space:nowrap;}
    .bank{font-weight:600;}
    .device-action{display:flex; gap:4px; justify-content:center; align-items:center;}
    .device-action select{font-size:13px; padding:2px 4px;}
    #pagination { margin-top:10px; text-align:center; }
    #pagination button { margin:0 4px; }
    #pagination button.active { background:var(--green); }
    #refreshBtn {
      display: block;
      width: 160px;
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      position: fixed;
      top: 20px;
      right: 30px;
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      opacity: 0.95;
    }
    /* accounts pagination */
    #accountsPagination { margin-top:10px; text-align:center; }
    #accountsPagination button { margin:0 4px; }
    #accountsPagination button.active { background:var(--green); }
    .small-muted { font-size:12px; color:#666; margin-left:8px; }

    /* Action buttons */
    button.btn-check {
      padding: 4px 8px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    button.btn-check:hover {
      background: #2980b9;
    }

    button.btn-deposit {
      padding: 4px 8px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    button.btn-deposit:hover {
      background: #27ae60;
    }

    button.btn-withdraw {
      padding: 4px 8px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    button.btn-withdraw:hover {
      background: #c0392b;
    }
    .ratio-high {
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Dashboard – Game LC79</h2>

  <button id="refreshBtn" onclick="refreshData()">🔄 Refresh</button>

  <!-- thêm controls phân trang cho bảng chính -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin:8px 0; gap:20px;">
    <div>
      <label>Hiển thị: <strong>15</strong> dòng / trang</label>
      <span class="small-muted"> (bảng tài khoản)</span>
    </div>
    <div>
      <label>Sắp xếp theo:</label>
      <select id="sortBySelect" onchange="handleSortChange()" style="padding:5px 8px; font-size:14px; border-radius:4px; border:1px solid #ccc;">
        <option value="default">Trạng Thái + Cược Ngày + Cược Tuần (Mặc định)</option>
        <option value="totalBetDay">Chỉ Tổng Cược Ngày (Giảm)</option>
        <option value="totalBetWeek">Chỉ Tổng Cược Tuần (Giảm)</option>
        <option value="totalBetMonth">Chỉ Tổng Cược Tháng (Giảm)</option>
        <option value="totalBetAll">Chỉ Tổng Cược (Giảm)</option>
        <option value="balance">Chỉ Số Dư (Giảm)</option>
        <option value="status">Chỉ Trạng Thái</option>
      </select>
    </div>
    <div id="accountsPagination" aria-label="Accounts pagination"></div>
  </div>

  <table id="tbl">
    <thead>
      <tr>
        <th>STT</th>
        <th>Username</th>
        <th>NickName</th>
        <th>Balance</th>
        <th>Tổng Cược Ngày</th>
        <th>Tổng Cược Tuần</th>
        <th>Tổng Cược Tháng</th>
        <th>Tổng Cược</th>
        <th>Tổng Nạp</th>
        <th>Tổng Rút</th>
        <th>Tỷ lệ</th>
        <th>Ngân hàng và STK</th>
        <th>Thiết Bị</th>
        <th>Proxy</th>
        <th>Access Token</th>
        <th>Nạp Ngày</th>
        <th>Rút Ngày</th>
        <th>Đu Dây</th>
        <th>Action</th>
        <th>Trạng Thái</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>


<script>
// Hàm refresh giữ nguyên vị trí cuộn
function refreshData() {
  const scrollY = window.scrollY;
  init().then(() => {
    window.scrollTo({ top: scrollY });
  });
}
const fmt = n => (Number(n||0)).toLocaleString('vi-VN');
// API Python chạy port 8080 trên cùng máy: dùng hostname hiện tại để truy cập từ internet
const api8080Base = `${window.location.protocol}//${window.location.hostname}:8080`;

let profileMap = {};
let allDevices = [];
let currentSortBy = 'default'; // Biến lưu loại sắp xếp hiện tại
let historyData = [];
let userMap = {};
let totalsByUser = {}; // { username: { deposit, withdraw } }

// Hàm xử lý thay đổi kiểu sắp xếp
function handleSortChange() {
  currentSortBy = document.getElementById('sortBySelect').value;
  currentAccountPage = 1; // Reset về trang 1
  init(); // Refresh lại dữ liệu
}

// ====== Phân trang cho bảng tài khoản (mới) ======
let currentAccountPage = 1;
const accountPageSize = 60; // <- mỗi trang 15 dòng như bạn yêu cầu

// ================= INIT =================
async function init() {
  await loadProfiles();
  await loadDevices();
  await loadTotalsByUser();      // 🆕 lấy tổng nạp/rút theo user từ backend (GROUP BY)
  await loadHistory();           // chỉ để hiển thị bảng lịch sử (không dùng để tính tổng)
  await loadAccountsWithStats(); // render bảng chính (bây giờ có phân trang)
}

// ================= LOAD PROFILES =================
async function loadProfiles() {
  try {
    const res = await fetch('/api/users');
    const arr = await res.json();
    profileMap = {};
    arr.forEach(p=>{
      profileMap[p.username] = { nickname: p.nickname || '', balance: Number(p.balance||0) };
    });
  } catch (e) {
    console.error('Lỗi load profiles:', e);
    profileMap = {};
  }
}

// ================= LOAD DEVICES =================
async function loadDevices() {
  try {
    const res = await fetch("/api/device-balances");
    allDevices = await res.json();
  } catch (err) {
    console.error("Lỗi khi load devices:", err);
    allDevices = [];
  }
}

// ================= LOAD TOTALS BY USER (API mới) =================
async function loadTotalsByUser() {
  try {
    const res = await fetch('/api/transactions/grouped/by-user');
    if (!res.ok) throw new Error('Không lấy được tổng nạp/rút');
    totalsByUser = await res.json() || {};
  } catch (e) {
    console.error('Lỗi loadTotalsByUser:', e);
    totalsByUser = {};
  }
}

// ================= LOAD ACCOUNTS + attach stats =================
async function loadAccountsWithStats() {
  try {
    const resAcc = await fetch('/api/accounts');
    const accounts = await resAcc.json();

    const resUsers = await fetch('/api/users');
    const users = await resUsers.json();

    // const resBets = await fetch('/api/bet-history/stats/lc79/users');
    // const betStats = await resBets.json();
    // => bằng đoạn sau để lấy từ bet_totals

    const resBets = await fetch('/api/bet-totals?page=1&limit=10000');
    const betResp = await resBets.json();
    const betRows = Array.isArray(betResp.data) ? betResp.data : (Array.isArray(betResp) ? betResp : []);
    const betMap = {};
    (betRows || []).forEach(s => {
      // bet_totals dùng các cột: username, total_day, total_week, total_month, total_all
      betMap[s.username] = {
        totalDay: Number(s.total_day || s.totalDay || 0),
        totalWeek: Number(s.total_week || s.totalWeek || 0),
        totalMonth: Number(s.total_month || s.totalMonth || 0),
        totalAll: Number(s.total_all || s.totalAll || 0)
      };
    });

    userMap = {};
    users.forEach(u => {
      userMap[u.username] = {
        status: u.status || "OFF Ngày",
        proxy: u.proxy || "",
        accessToken: u.accessToken || "",
        streak_win_today: 0,
        streak_lose_today: 0,
        streak_current_type: null,
        streak_current_len: 0
      };
    });

    // Lấy dữ liệu streaks từ API /streaks/batch cho các account hiện có
    try {
      const usernames = Array.from(new Set((accounts || []).map(a => a.username).filter(Boolean)));
      if (usernames.length > 0) {
        const r = await fetch('/streaks/batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usernames })
        });
        if (r.ok) {
          const batch = await r.json(); // { username: {best_win_today,...}, ... }
          usernames.forEach(uname => {
            const s = batch[uname] || {};
            userMap[uname] = userMap[uname] || {};
            userMap[uname].streak_win_today = Number(s.best_win_today || 0);
            userMap[uname].streak_lose_today = Number(s.best_lose_today || 0);
            userMap[uname].streak_current_type = s.current_type || null;
            userMap[uname].streak_current_len = Number(s.current_len || 0);
          });
        }
      }
    } catch (e) {
      console.warn('Không lấy được streaks batch:', e);
    }

    // Nạp ngày vẫn dựa theo historyData (lọc trong ngày)
    const todayDepositMap = buildTodayDepositMap();
    const todayWithdrawMap = buildTodayWithdrawMap();

    // Gắn số liệu vào accounts
    (accounts || []).forEach(acc => {
      acc.status = userMap[acc.username]?.status || "OFF Ngày";
      acc.proxy = userMap[acc.username]?.proxy || "";
      acc.accessToken = userMap[acc.username]?.accessToken || "";
      acc.totalBetDay = betMap[acc.username]?.totalDay || 0;
      acc.totalBetWeek = betMap[acc.username]?.totalWeek || 0;
      acc.totalBetMonth = betMap[acc.username]?.totalMonth || 0;
      acc.totalBetAll = betMap[acc.username]?.total_all || betMap[acc.username]?.totalAll || 0;
      acc.todayDeposit = todayDepositMap[acc.username] || 0;
      acc.todayWithdraw = todayWithdrawMap[acc.username] || 0;
      acc.balance = Number(profileMap[acc.username]?.balance || 0); // đồng bộ số dư để sắp xếp đúng

      // ✅ Tổng nạp/rút theo API GROUP BY (KHÔNG còn phụ thuộc 100 bản ghi)
      acc.totalDeposit = totalsByUser[acc.username]?.deposit || 0;
      acc.totalWithdraw = totalsByUser[acc.username]?.withdraw || 0;
    });

    renderTable(accounts || []);
  } catch (err) {
    console.error("Lỗi khi load accounts:", err);
    renderTable([]);
  }
}




// ========== MODAL NẠP TIỀN ==========
function openDepositModal(username) {
  console.log('🔍 openDepositModal được gọi cho user:', username);
  
  // Random từ 200k đến 290k, bội số của 10k
  const randomAmount = (Math.floor(Math.random() * 10) + 20) * 10000; // 200k-290k
  const amount = prompt(`Nhập số tiền nạp cho user ${username}:`, randomAmount.toString());
  console.log('💰 Số tiền nhập:', amount);
  if (!amount || amount <= 0) {
    console.log('❌ Số tiền không hợp lệ');
    return;
  }
  deposit(username, amount);
}

async function deposit(username, amount) {
  console.log('📤 Bắt đầu nạp tiền:', { username, amount });
  
  try {
    const payload = { username, amount: Number(amount) };
    console.log('📦 Payload gửi đi:', payload);
    
    const res = await fetch(`${api8080Base}/api/deposit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    console.log('📥 Response status:', res.status);
    const data = await res.json();
    console.log('📥 Response data:', data);

    if (!res.ok) {
      console.error('❌ API trả về lỗi:', data);
      alert(`❌ Lỗi nạp tiền: ${data.error || 'Unknown error'}`);
      return;
    }

    console.log('✅ Nhận dữ liệu nạp tiền thành công!');
    
    // Hiển thị QR modal
    if (data.ok && data.data) {
      showQRModal(data);
    } else {
      alert(`✅ Nạp tiền thành công!\n${data.message || JSON.stringify(data, null, 2)}`);
    }
    
    loadAccountsWithStats(); // Refresh bảng
  } catch (err) {
    console.error('❌ Lỗi khi nạp tiền:', err);
    alert('❌ Lỗi khi nạp tiền: ' + err.message);
  }
}

// Hiển thị modal QR code
function showQRModal(data) {
  const qrData = data.data;
  
  console.log('🖼️ QR Data:', qrData);
  
  // Tạo modal
  const modal = document.createElement('div');
  modal.style.cssText = `
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  `;
  
  const content = document.createElement('div');
  content.style.cssText = `
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    max-width: 500px;
    text-align: center;
  `;
  
  // Ưu tiên: qr_link (URL) > qr_base64 > qr
  let qrImageSrc = qrData.qrLink || qrData.qr_link || '';
  
  // Nếu không có link, dùng base64
  if (!qrImageSrc) {
    const base64Data = qrData.qr_base64 || qrData.qrBase64 || qrData.qr;
    if (base64Data) {
      qrImageSrc = `data:image/png;base64,${base64Data}`;
    }
  }
  
  console.log('🖼️ QR Image Source:', qrImageSrc);
  
  content.innerHTML = `
    <h2 style="margin-top:0; color:#2ecc71;">✅ ${data.message || 'Tạo lệnh nạp tiền thành công'}</h2>
    
    <div style="background:#f8f9fa; padding:20px; border-radius:10px; margin:20px 0;">
      <h3 style="margin-top:0;">Thông tin chuyển khoản</h3>
      <p style="margin:8px 0;"><strong>🎮 User:</strong> ${qrData.username || 'N/A'}</p>
      <p style="margin:8px 0;"><strong>👤 Tên TK:</strong> ${qrData.name || qrData.accountHolder || 'N/A'}</p>
      <p style="margin:8px 0;"><strong>🏦 Số TK:</strong> ${qrData.receiver || qrData.accountNumber || 'N/A'}</p>
      <p style="margin:8px 0;"><strong>💰 Số tiền:</strong> ${Number(qrData.amount || 0).toLocaleString('vi-VN')} đ</p>
      <p style="margin:8px 0;"><strong>📝 Nội dung:</strong> <span style="color:#e74c3c; font-weight:bold;">${qrData.msg || qrData.transferContent || 'N/A'}</span></p>
    </div>
    
    <div style="margin:20px 0;">
      ${qrImageSrc ? `
        <img src="${qrImageSrc}" alt="QR Code" 
          style="max-width:300px; width:100%; border:2px solid #ddd; border-radius:8px;" 
          onerror="console.error('Lỗi load QR:', this.src); this.style.display='none'; this.nextElementSibling.style.display='block';">
      ` : ''}
      <div style="display:${qrImageSrc ? 'none' : 'block'}; padding:40px; background:#f8d7da; color:#721c24; border-radius:8px;">
        ❌ Không thể tải mã QR<br>
        <small>Vui lòng chuyển khoản theo thông tin bên trên</small>
      </div>
    </div>
    
    <p style="color:#7f8c8d; font-size:13px;">Vui lòng quét mã QR hoặc chuyển khoản theo thông tin trên</p>
    <p style="color:#e74c3c; font-size:12px;">⏰ Hết hạn sau: <strong>${qrData.expired || 300}</strong> giây</p>
    
    <button onclick="this.closest('div').parentElement.remove()" style="
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    ">Đóng</button>
  `;
  
  modal.appendChild(content);
  document.body.appendChild(modal);
  
  // Click bên ngoài để đóng
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      document.body.removeChild(modal);
    }
  });
}

// ========== MODAL RÚT TIỀN ==========
function openWithdrawModal(username) {
  console.log('🔍 openWithdrawModal được gọi cho user:', username);
  
  // Tạo modal tùy chỉnh với các button số tiền
  const modal = document.createElement('div');
  modal.style.cssText = `
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  `;
  
  const content = document.createElement('div');
  content.style.cssText = `
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    max-width: 500px;
  `;
  
  content.innerHTML = `
    <h3 style="margin-top:0; margin-bottom:20px; text-align:center;">Chọn số tiền rút cho ${username}</h3>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;">
      <button class="withdraw-amount-btn" data-amount="100000" style="padding: 15px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">100K</button>
      <button class="withdraw-amount-btn" data-amount="200000" style="padding: 15px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">200K</button>
      <button class="withdraw-amount-btn" data-amount="300000" style="padding: 15px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">300K</button>
      <button class="withdraw-amount-btn" data-amount="500000" style="padding: 15px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">500K</button>
      <button class="withdraw-amount-btn" data-amount="600000" style="padding: 15px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">600K</button>
      <button class="withdraw-amount-btn" data-amount="800000" style="padding: 15px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">800K</button>
      <button class="withdraw-amount-btn" data-amount="1000000" style="padding: 15px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">1TR</button>
      <button class="withdraw-amount-btn" data-amount="2000000" style="padding: 15px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">2TR</button>
    </div>
    <button id="cancelWithdraw" style="width: 100%; padding: 10px; font-size: 14px; background: #95a5a6; color: white; border: none; border-radius: 6px; cursor: pointer;">Hủy</button>
  `;
  
  modal.appendChild(content);
  document.body.appendChild(modal);
  
  // Xử lý click các button số tiền
  content.querySelectorAll('.withdraw-amount-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const amount = btn.getAttribute('data-amount');
      console.log('💰 Button số tiền được click:', amount);
      document.body.removeChild(modal);
      withdraw(username, amount);
    });
    
    btn.addEventListener('mouseenter', (e) => {
      e.target.style.background = '#c0392b';
    });
    
    btn.addEventListener('mouseleave', (e) => {
      e.target.style.background = '#e74c3c';
    });
  });
  
  // Xử lý nút hủy
  content.querySelector('#cancelWithdraw').addEventListener('click', () => {
    document.body.removeChild(modal);
  });
  
  // Click ra ngoài để đóng
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      document.body.removeChild(modal);
    }
  });
}

async function withdraw(username, amount) {
  console.log('📤 Bắt đầu rút tiền:', { username, amount });
  try {
    const payload = { username, amount: Number(amount) };
    console.log('📦 Payload gửi đi:', payload);

    // Gọi API Flask mới (port 8080)
    const res = await fetch(`${api8080Base}/api/withdraw`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    console.log('📥 Response status:', res.status);
    const data = await res.json();
    console.log('📥 Response data:', data);

    if (!res.ok || !data.ok) {
      console.error('❌ API trả về lỗi:', data);
      alert(`❌ Lỗi rút tiền: ${data.error || data.message || 'Unknown error'}`);
      return;
    }

// Bây giờ renderTable nhận tất cả accounts, lọc LC79, rồi phân trang
function renderTable(rows) {
  const tbody = document.querySelector('#tbl tbody');
  tbody.innerHTML = '';


  // Lọc LC79
  let filtered = (rows || []).filter(r => (r.game||'').toUpperCase() === 'LC79');

  // Sắp xếp theo loại được chọn
  const statusPriority = {
    'Đang Chơi': 1,
    'Hết Tiền': 2,
    'Đủ Ngày': 3,
    'Đủ Tuần': 4,
    'Đủ Tháng': 5
  };

  filtered = filtered.sort((a, b) => {
    if (currentSortBy === 'default') {
      // Sắp xếp mặc định: Trạng thái + Cược Ngày + Cược Tuần + Cược Tháng
      const pa = statusPriority[a.status] || 99;
      const pb = statusPriority[b.status] || 99;
      if (pa !== pb) return pa - pb;
      const betA = Number(a.totalBetDay || 0);
      const betB = Number(b.totalBetDay || 0);
      if (betA !== betB) return betB - betA;
      const weekA = Number(a.totalBetWeek || 0);
      const weekB = Number(b.totalBetWeek || 0);
      if (weekA !== weekB) return weekB - weekA;
      const monthA = Number(a.totalBetMonth || 0);
      const monthB = Number(b.totalBetMonth || 0);
      if (monthA !== monthB) return monthB - monthA;
      return (a.username || '').localeCompare(b.username || '');
    } else if (currentSortBy === 'totalBetDay') {
      // Chỉ sắp xếp theo tổng cược ngày
      const betA = Number(a.totalBetDay || 0);
      const betB = Number(b.totalBetDay || 0);
      return betB - betA;
    } else if (currentSortBy === 'totalBetWeek') {
      // Chỉ sắp xếp theo tổng cược tuần
      const weekA = Number(a.totalBetWeek || 0);
      const weekB = Number(b.totalBetWeek || 0);
      return weekB - weekA;
    } else if (currentSortBy === 'totalBetMonth') {
      // Chỉ sắp xếp theo tổng cược tháng
      const monthA = Number(a.totalBetMonth || 0);
      const monthB = Number(b.totalBetMonth || 0);
      return monthB - monthA;
    } else if (currentSortBy === 'totalBetAll') {
      // Chỉ sắp xếp theo tổng cược toàn thời gian
      const allA = Number(a.totalBetAll || 0);
      const allB = Number(b.totalBetAll || 0);
      return allB - allA;
    } else if (currentSortBy === 'balance') {
      // Chỉ sắp xếp theo số dư
      const balA = Number(a.balance || 0);
      const balB = Number(b.balance || 0);
      return balB - balA;
    } else if (currentSortBy === 'status') {
      // Chỉ sắp xếp theo trạng thái
      const pa = statusPriority[a.status] || 99;
      const pb = statusPriority[b.status] || 99;
      return pa - pb;
    }
    return 0;
  });

  // đảm bảo currentAccountPage nằm trong giới hạn
  const totalPages = Math.max(1, Math.ceil(filtered.length / accountPageSize));
  if (currentAccountPage > totalPages) currentAccountPage = totalPages;
  if (currentAccountPage < 1) currentAccountPage = 1;

  const start = (currentAccountPage - 1) * accountPageSize;
  const end = start + accountPageSize;
  const pageItems = filtered.slice(start, end);

  pageItems.forEach((r, idx) => {
    const uname = r.username;
    const p = profileMap[uname] || {};
    tbody.insertAdjacentHTML('beforeend', `
      <tr style="background:${getRowColor(r.status)}">
        <td>${(start + idx + 1)}</td>
        <td class="nowrap">${uname}</td>
        <td>${p.nickname || ''}</td>
        <td class="right">${fmt(p.balance)}</td>
        <td class="right">${fmt(r.totalBetDay || 0)}</td>
        <td class="right">${fmt(r.totalBetWeek || 0)}</td>
        <td class="right">${fmt(r.totalBetMonth || 0)}</td>
        <td class="right">${fmt(r.totalBetAll || 0)}</td>
        <td class="right">${fmt(r.totalDeposit)}</td>
        <td class="right">${fmt(r.totalWithdraw)}</td>
        <td class="right ${(Number(r.totalDeposit || 0) > 0 && ((Number(r.totalWithdraw || 0) + Number(p.balance || 0)) / Number(r.totalDeposit || 1)) > 1.50) ? 'ratio-high' : ''}">
          ${Number(r.totalDeposit || 0) > 0 ? ((Number(r.totalWithdraw || 0) + Number(p.balance || 0)) / Number(r.totalDeposit || 1)).toFixed(2) : '0.00'}
        </td>
        <td>${bankCell(r.bank, r.accountNumber)}</td>
        <td>${deviceEditable(uname, r.device)}</td>
        <td style="max-width:130px; min-width:60px; width:130px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
          <span class="editable-proxy" data-username="${uname}" data-full="${r.proxy || ''}">
            ${(r.proxy && r.proxy.length > 18) ? r.proxy.slice(0, 15) + '...' : (r.proxy || '---')}
          </span>
        </td>
        <td style="max-width:130px; min-width:60px; width:130px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
          <span class="editable-token" data-username="${uname}" data-full="${r.accessToken || ''}">
            ${(r.accessToken && r.accessToken.length > 18) ? r.accessToken.slice(0, 15) + '...' : (r.accessToken || '---')}
          </span>
        </td>
        <td class="right">${fmt(r.todayDeposit||0)}</td>
        <td class="right">${fmt(r.todayWithdraw||0)}</td>
        <td class="right">
          ${fmt(userMap[uname]?.streak_win_today || 0)}/
          ${fmt(userMap[uname]?.streak_lose_today || 0)}/
          ${fmt(userMap[uname]?.streak_current_len || 0)}
        </td>
        <td>
          <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:center;">
            <button class="btn-check" onclick="forceCheck('${uname}')">🔄 Check</button>
            <button class="btn-deposit" onclick="openDepositModal('${uname}')">💰 Nạp</button>
            <button class="btn-withdraw" onclick="openWithdrawModal('${uname}')">💸 Rút</button>
          </div>
        </td>
        <td>${statusSelect(uname, r.status)}</td>
      </tr>
    `);
  });

  // cập nhật phân trang cho bảng accounts
  renderAccountsPagination(filtered.length, totalPages, currentAccountPage);

}

function renderAccountsPagination(totalItems, totalPages, currentPageLocal) {
  const container = document.getElementById('accountsPagination');
  container.innerHTML = '';

  // nếu không cần phân trang thì giữ trống
  if (totalPages <= 1) {
    container.innerHTML = `<span class="small-muted">Tổng ${totalItems} tài khoản</span>`;
    return;
  }

  const firstBtn = document.createElement('button');
  firstBtn.innerText = '<<';
  firstBtn.disabled = currentPageLocal === 1;
  firstBtn.addEventListener('click', () => { currentAccountPage = 1; renderTableFromCurrent(); });
  container.appendChild(firstBtn);

  const prevBtn = document.createElement('button');
  prevBtn.innerText = '<';
  prevBtn.disabled = currentPageLocal === 1;
  prevBtn.addEventListener('click', () => { currentAccountPage = Math.max(1, currentAccountPage - 1); renderTableFromCurrent(); });
  container.appendChild(prevBtn);

  // show số trang (giãn nếu quá nhiều)
  const maxButtons = 7;
  let start = Math.max(1, currentPageLocal - Math.floor(maxButtons/2));
  let finish = Math.min(totalPages, start + maxButtons - 1);
  if (finish - start < maxButtons - 1) start = Math.max(1, finish - maxButtons + 1);

  for (let i = start; i <= finish; i++) {
    const b = document.createElement('button');
    b.innerText = i;
    if (i === currentPageLocal) b.classList.add('active');
    b.addEventListener('click', () => { currentAccountPage = i; renderTableFromCurrent(); });
    container.appendChild(b);
  }

  const nextBtn = document.createElement('button');
  nextBtn.innerText = '>';
  nextBtn.disabled = currentPageLocal === totalPages;
  nextBtn.addEventListener('click', () => { currentAccountPage = Math.min(totalPages, currentAccountPage + 1); renderTableFromCurrent(); });
  container.appendChild(nextBtn);

  const lastBtn = document.createElement('button');
  lastBtn.innerText = '>>';
  lastBtn.disabled = currentPageLocal === totalPages;
  lastBtn.addEventListener('click', () => { currentAccountPage = totalPages; renderTableFromCurrent(); });
  container.appendChild(lastBtn);

  // thêm tổng
  const info = document.createElement('span');
  info.className = 'small-muted';
  info.innerText = ` Tổng ${totalItems} tài khoản - Trang ${currentPageLocal}/${totalPages}`;
  container.appendChild(info);
}

function renderTableFromCurrent() {
  // loadAccountsWithStats sẽ gọi renderTable khi hoàn tất; nhưng ở đây chúng ta đã có dữ liệu hiện tại,
  // nên chỉ gọi lại renderTable với dữ liệu hiện có: fetch lại /api/accounts để đồng bộ tốt hơn.
  // Tuy nhiên để đơn giản và nhanh, gọi loadAccountsWithStats để đảm bảo mọi dữ liệu cập nhật.
  loadAccountsWithStats();
}

  try {

    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error || "Cập nhật thiết bị thất bại");

}

async function loadHistory() {
  try {
    const res = await fetch("/api/transactions/all?limit=200&page=1");
    const data = await res.json();
    historyData = data.data || [];
    historyData.sort((a, b) => new Date(b.time) - new Date(a.time));
    renderHistoryPage(currentPage);
  } catch (err) {
    console.error("Lỗi khi load lịch sử:", err);
  }
}

function buildTodayDepositMap() {
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const endOfDay = startOfDay + 24 * 60 * 60 * 1000;
  const todayMap = {};

  historyData.forEach(txn => {
    if (txn.type === "Nạp tiền") {
      const t = new Date(txn.time).getTime();
      if (t >= startOfDay && t < endOfDay) {
        todayMap[txn.username] = (todayMap[txn.username] || 0) + Number(txn.amount || 0);
      }
    }
  });

  return todayMap;
}
function buildTodayWithdrawMap() {
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const endOfDay = startOfDay + 24 * 60 * 60 * 1000;
  const todayWithdrawMap = {};

  historyData.forEach(txn => {
    if (txn.type === "Rút tiền") {
      const t = new Date(txn.time).getTime();
      if (t >= startOfDay && t < endOfDay) {
        todayWithdrawMap[txn.username] = (todayWithdrawMap[txn.username] || 0) + Number(txn.amount || 0);
      }
    }
  });

  return todayWithdrawMap;
}

function renderHistoryPage(page) {
  const tbody = document.querySelector("#historyTable tbody");
  tbody.innerHTML = "";
  const start = (page - 1) * pageSize;
  const end = start + pageSize;
  const pageItems = historyData.slice(start, end);

  pageItems.forEach(txn => {
    let deviceCell = "";

    if (txn.type === "Nạp tiền") {
      if (txn.device) {
        deviceCell = `<span>${txn.device}</span>`;
      } else {
        deviceCell = `
          <select id="txnDevice-${txn.transactionId}">
            <option value="">--Device--</option>
            ${allDevices.map(d => `
              <option value="${d.device}">
                ${d.device} (${(d.balance||0).toLocaleString('vi-VN')} đ)
              </option>
            `).join('')}
          </select>
          <button onclick="confirmTxnDevice('${txn.transactionId}')">✔️</button>
          <button onclick="cancelTxnDevice('${txn.transactionId}')">❌</button>
        `;
      }
    } else {
      deviceCell = `<span class="muted">---</span>`;
    }

    tbody.innerHTML += `
      <tr>
        <td>${txn.username}</td>
        <td>${txn.nickname || ''}</td>
        <td style="color:${txn.type === 'Nạp tiền' ? 'red' : 'green'}; font-weight:bold;">
          ${txn.type}
        </td>
        <td class="right">${(txn.amount||0).toLocaleString('vi-VN')} đ</td>
        <td>${txn.transactionId || ''}</td>
        <td>${deviceCell}</td>
        <td>${txn.time}</td>
      </tr>
    `;
  });

  renderPagination();
}

function renderPagination() {
  const totalPages = Math.ceil(historyData.length / pageSize);
  const container = document.getElementById("pagination");
  container.innerHTML = "";
  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.innerText = i;
    if (i === currentPage) btn.classList.add("active");
    btn.addEventListener("click", () => {
      currentPage = i;
      renderHistoryPage(currentPage);
    });
    container.appendChild(btn);
  }
}
